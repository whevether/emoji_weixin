name: emoji_weixin
description: WeChat-style emoji/sticker panel for Flutter with Klipy search, custom stickers, camera capture, and multi-language UI.
version: 0.3.4
homepage: https://github.com/whevether/emoji_weixin
repository: https://github.com/whevether/emoji_weixin

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.6.0
  extended_image: ^10.1.0
  http: ^1.6.0
  image_picker: ^1.2.4
  path: ^1.9.1
  path_provider: ^2.1.6
  pro_image_editor: ^14.11.0
  tostore: ^3.5.1
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  assets:
    - assets/stickers/douyin/info.json
    - assets/stickers/douyin/static/
